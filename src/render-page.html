<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>GLB Render</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script id="render-opts" type="application/json">__RENDER_OPTS__</script>
  <script type="module">
    const opts = JSON.parse(document.getElementById('render-opts').textContent);
    const THREE_URL = '__THREE_URL__';
    const LOADER_URL = '__LOADER_URL__';

    async function main() {
      const THREE = await import(THREE_URL);
      const { GLTFLoader } = await import(LOADER_URL);

      const scene = new THREE.Scene();

      const canvas = document.createElement('canvas');
      const contextAttrs = {
        antialias: !!opts.antialias,
        alpha: opts.bg === 'transparent',
        powerPreference: 'high-performance'
      };
      const gl2 = canvas.getContext('webgl2', contextAttrs);
      const gl = gl2 || canvas.getContext('webgl', contextAttrs) || canvas.getContext('experimental-webgl', contextAttrs);
      if (!gl) {
        throw new Error('Unable to create WebGL context (webgl2/webgl)');
      }

      const renderer = new THREE.WebGLRenderer({
        canvas,
        context: gl,
        antialias: !!opts.antialias,
        alpha: opts.bg === 'transparent',
        powerPreference: 'high-performance'
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure;
      renderer.setPixelRatio(1);
      renderer.setSize(opts.width, opts.height, false);

      if (opts.bg === 'transparent') {
        renderer.setClearColor(0x000000, 0);
        scene.background = null;
      } else {
        renderer.setClearColor(0xffffff, 1);
        scene.background = new THREE.Color(0xffffff);
      }

      document.body.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(40, opts.width / opts.height, 0.1, 100);
      camera.position.set(0, 0, 4);
      camera.lookAt(0, 0, 0);

      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);

      const key = new THREE.DirectionalLight(0xffffff, 1.2);
      key.position.set(3, 5, 4);
      scene.add(key);

      const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
      fill.position.set(-3, 2, -2);
      scene.add(fill);

      function disposeObject(obj) {
        obj.traverse((child) => {
          if (child.geometry && typeof child.geometry.dispose === 'function') {
            child.geometry.dispose();
          }
          const mats = child.material ? (Array.isArray(child.material) ? child.material : [child.material]) : [];
          for (const mat of mats) {
            if (!mat) continue;
            for (const key of Object.keys(mat)) {
              const value = mat[key];
              if (value && value.isTexture && typeof value.dispose === 'function') {
                value.dispose();
              }
            }
            if (typeof mat.dispose === 'function') {
              mat.dispose();
            }
          }
        });
      }

      function normalizeModel(model) {
        model.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        const safeMaxDim = Number.isFinite(maxDim) && maxDim > 0 ? maxDim : 1;
        const scale = 2.0 / safeMaxDim;
        model.scale.setScalar(scale);
        const center = new THREE.Vector3();
        box.getCenter(center);
        model.position.sub(center.multiplyScalar(scale));
      }

      const loader = new GLTFLoader();
      let currentModel = null;

      async function loadModel(url) {
        if (currentModel) {
          scene.remove(currentModel);
          disposeObject(currentModel);
          currentModel = null;
        }
        const gltf = await loader.loadAsync(url);
        currentModel = gltf.scene;
        scene.add(currentModel);
        normalizeModel(currentModel);
      }

      function applyView(view) {
        if (view && Number.isFinite(view.fov)) {
          camera.fov = view.fov;
          camera.updateProjectionMatrix();
        }
        if (view && Number.isFinite(view.x) && Number.isFinite(view.y) && Number.isFinite(view.z)) {
          camera.position.set(view.x, view.y, view.z);
        }
        camera.lookAt(0, 0, 0);
      }

      const warmupFrames = Number.isFinite(opts.warmupFrames) ? Math.max(1, opts.warmupFrames) : 1;
      const viewFrames = Number.isFinite(opts.viewFrames) ? Math.max(1, opts.viewFrames) : 1;

      await loadModel('model.glb');
      applyView(opts.initialView || null);
      for (let i = 0; i < warmupFrames; i++) {
        renderer.render(scene, camera);
      }

      const glCtx = renderer.getContext();
      let glVendor = '';
      let glRenderer = '';
      try {
        const dbg = glCtx.getExtension('WEBGL_debug_renderer_info');
        if (dbg) {
          glVendor = glCtx.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '';
          glRenderer = glCtx.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '';
        }
      } catch {}
      window.__RENDER_INFO__ = {
        glVendor,
        glRenderer,
        antialias: !!opts.antialias,
        warmupFrames,
        viewFrames
      };

      window.__SET_VIEW__ = async (view) => {
        applyView(view);
        for (let i = 0; i < viewFrames; i++) {
          renderer.render(scene, camera);
        }
        return true;
      };
      window.__LOAD_MODEL__ = async (url) => {
        await loadModel(url || 'model.glb');
        for (let i = 0; i < warmupFrames; i++) {
          renderer.render(scene, camera);
        }
        return true;
      };
      window.__RENDER_DONE__ = true;
    }

    main().catch((err) => {
      console.error('RENDER_ERROR', err);
      window.__RENDER_ERROR__ = String(err && err.stack ? err.stack : err);
    });
  </script>
</body>
</html>
